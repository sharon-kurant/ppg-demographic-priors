[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ppg-demographic-priors"
version = "0.4.1"
description = "Subject-disjoint evaluation of demographic priors with frozen and fine-tuned PPG foundation models"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  {name = "Sharon Kurant"},
]
keywords = [
  "photoplethysmography",
  "blood pressure",
  "foundation models",
  "demographics",
  "nested cross-validation",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
  "h5py>=3.10",
  "matplotlib>=3.8",
  "mne==1.10.2",
  "numpy>=1.26,<3",
  "openpyxl>=3.1",
  "pandas>=2.0",
  "PyYAML>=6.0",
  "scikit-learn>=1.3",
  "scipy>=1.10",
]

[project.optional-dependencies]
foundation-models = [
  "torch>=1.12",
]
[project.scripts]
ppg-bp = "ppg_bp_incremental.cli:main"

[project.urls]
Repository = "https://github.com/sharon-kurant/ppg-demographic-priors"
Documentation = "https://github.com/sharon-kurant/ppg-demographic-priors#readme"
Issues = "https://github.com/sharon-kurant/ppg-demographic-priors/issues"

[tool.setuptools.packages.find]
where = ["src"]
